name: Code Count

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cloc
        run: sudo apt-get install -y cloc

      - name: Count lines of code
        run: |
          cloc . \
            --exclude-dir=vendor,node_modules,formats_latex,formats_pdflatex,template \
            --exclude-ext=fmt,fls,aux,log,pdf,gz,synctex \
            --md \
            --out=cloc-report.md
          cat cloc-report.md

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloc-report
          path: cloc-report.md
